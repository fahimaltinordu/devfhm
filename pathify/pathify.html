<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=320,height=480">
<meta name="viewport" content="width=320, initial-scale=1.0, user-scalable=no">
<title>Pathify</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 320px;
    height: 480px;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .ad {
    position: relative;
    width: 320px;
    height: 480px;
    background: linear-gradient(160deg, #F2775F 0%, #E85D4C 45%, #C43F30 100%);
    overflow: hidden;
    cursor: pointer;
  }

  /* subtle repeating grid texture, evokes the game board — CSS only, no image */
  .grid-tex {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 46px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 46px);
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-sizing: border-box;
    padding: 26px 18px 20px;
  }

  .wordmark {
    color: #ffffff;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.25);
    margin: 0;
  }

  .tagline {
    margin-top: 6px;
    background: rgba(255,255,255,0.92);
    color: #C43F30;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.6px;
    padding: 5px 12px;
    border-radius: 999px;
  }

  .icon-wrap {
    position: relative;
    margin-top: 24px;
    width: 118px;
    height: 118px;
  }

  .icon-glow {
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 70%);
    animation: pulse 2.2s ease-in-out infinite;
  }

  .icon-wrap img {
    position: relative;
    width: 118px;
    height: 118px;
    border-radius: 28px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.28);
    animation: pulse 2.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .path-graphic {
    margin-top: 22px;
    width: 260px;
    height: 120px;
  }

  .path-line {
    fill: none;
    stroke: #ffffff;
    stroke-width: 12;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.95;
    stroke-dasharray: 420;
    stroke-dashoffset: 420;
    animation: draw 2.6s ease-in-out infinite alternate;
  }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  .dot { stroke: #ffffff; stroke-width: 4; }
  .dot-label {
    fill: #ffffff;
    font-size: 20px;
    font-weight: 800;
    text-anchor: middle;
    dominant-baseline: central;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .spacer { flex: 1; }

  .cta {
    background: #ffffff;
    color: #E85D4C;
    font-size: 20px;
    font-weight: 800;
    padding: 15px 44px;
    border-radius: 999px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    animation: ctaPulse 1.7s ease-in-out infinite;
    margin-bottom: 8px;
  }

  @keyframes ctaPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }

  .subcta {
    color: rgba(255,255,255,0.9);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
</style>
</head>
