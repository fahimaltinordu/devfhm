<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=480,height=320">
<title>Kelimebaz</title>
<style>
  html,body{margin:0;padding:0;width:480px;height:320px;overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;}

  .banner{
    position:relative;
    width:480px;height:320px;
    background:linear-gradient(160deg,#0F1A17 0%,#1E332C 100%);
    cursor:pointer;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .deco{position:absolute;border:2px solid #3E5A50;border-radius:12px;opacity:.32;}
  .deco1{width:60px;height:60px;top:-14px;left:-14px;transform:rotate(-12deg);}
  .deco2{width:52px;height:52px;bottom:-12px;right:-12px;transform:rotate(11deg);}

  .icon-wrap{
    flex:none;
    width:150px;height:150px;
    border-radius:30px;
    border:3px solid #D4AF37;
    overflow:hidden;
    box-shadow:0 10px 26px rgba(0,0,0,.45);
    animation:breathe 2.2s ease-in-out infinite;
    margin-right:34px;
  }
  .icon-wrap img{width:100%;height:100%;display:block;}

  @keyframes breathe{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.07);}
  }

  .content{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
  }

  .title{
    font-size:32px;
    font-weight:800;
    color:#F5F3EE;
    letter-spacing:-.3px;
  }

  .rule{width:56px;height:3px;background:#D4AF37;margin:10px 0 12px;border:none;}

  .tagline{
    font-size:15px;
    font-weight:700;
    color:#F5F3EE;
    line-height:1.5;
  }
  .tagline b{color:#D4AF37;}

  .features{
    display:flex;
    margin-top:14px;
  }
  .feature{
    display:flex;
    align-items:center;
    background:rgba(212,175,55,.10);
    border:1.5px solid rgba(212,175,55,.35);
    border-radius:999px;
    padding:5px 12px;
    margin-right:12px;
  }
  .feature .glyph{font-size:14px;color:#D4AF37;margin-right:6px;}
  .feature .lbl{font-size:11.5px;font-weight:700;color:#F5F3EE;}

  .cta{
    margin-top:18px;
    background:#10B981;
    color:#0F1A17;
    font-size:16px;
    font-weight:800;
    padding:12px 34px;
    border-radius:999px;
    box-shadow:0 6px 18px rgba(16,185,129,.45);
    letter-spacing:.3px;
  }
</style>
</head>
